services:
  - type: web
    name: verdict-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: RATE_LIMIT_FREE_AUDITS_PER_DAY
        value: "5"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/src/backend/.cache/playwright"
