name: Supabase Keepalive

on:
  schedule:
    - cron: '0 9 * * *'   # daily at 09:00 UTC — Supabase needs activity most days of the week
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (audit_job table, anon key)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://shsouuvbiyoqcfdmcoxs.supabase.co/rest/v1/audit_job?limit=1")
          echo "Supabase REST API responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "Unexpected status $STATUS — keepalive may have failed"
            exit 1
          fi
          echo "Keepalive success."
